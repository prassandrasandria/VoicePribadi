<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="driacomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#080c14" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#driacomGrad)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Stylized "D" + Soundwave / Aperture Studio Icon -->
  <g filter="url(#glow)">
    <!-- Outer D curve -->
    <path
      d="M18 16 H32 C42 16 48 23 48 32 C48 41 42 48 32 48 H18 Z"
      stroke="url(#driacomGrad)"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Center AI Sparkle / Wave bars -->
    <path
      d="M26 24 V40"
      stroke="url(#innerGlow)"
      stroke-width="3.5"
      stroke-linecap="round"
    />
    <path
      d="M33 28 V36"
      stroke="url(#innerGlow)"
      stroke-width="3"
      stroke-linecap="round"
    />
    <!-- Glowing AI Star node -->
    <circle cx="33" cy="32" r="2.5" fill="#38bdf8" />
  </g>
</svg>
